version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agent_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 015640
      POSTGRES_DB: agent_memory_db
    ports:
      - "5432:5432"
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data
    restart: always

  agent_service:
    build: .
    container_name: autonomous_agent_runtime
    environment:
      - DATABASE_URL=postgresql://postgres:015640@db:5432/agent_memory_db
      - OLLAMA_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    restart: always

volumes:
  agent_postgres_data: